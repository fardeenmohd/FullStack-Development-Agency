version: '3.8'

services:
  frontend-nextjs:
    build: ./frontend-nextjs
    ports:
      - "3000:3000"
    depends_on:
      - backend-java
      - compute-python

  backend-java:
    build: ./backend-java
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/trade_platform
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db

  compute-python:
    build: ./compute-python
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=jdbc:mysql://db:3306/trade_platform
      - SECRET_KEY=your_secret_key
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=trade_platform
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: